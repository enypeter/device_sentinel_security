name: device_sentinel_security
description: >-
  Client-side device security checks for Flutter: emulator, root, jailbreak,
  debugger, Frida, hooking and tamper detection, plus a runtime monitor and a
  host-configurable block / warn policy.
version: 0.1.0
homepage: https://github.com/enypeter/device_sentinel_security
repository: https://github.com/enypeter/device_sentinel_security
topics:
  - security
  - root-detection
  - jailbreak-detection
  - anti-tamper
  - emulator-detection

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  plugin:
    platforms:
      android:
        package: dev.devicesentinel.device_sentinel_security
        pluginClass: DeviceSentinelSecurityPlugin
      ios:
        pluginClass: DeviceSentinelSecurityPlugin
